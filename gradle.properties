# Project-wide Gradle settings.

# Daemon keeps the JVM alive between builds — faster incremental builds
org.gradle.daemon=true

# Build modules in parallel
org.gradle.parallel=true

# Cache task outputs — avoids re-running unchanged tasks
org.gradle.caching=true

# Use configuration cache for even faster configuration phase
org.gradle.configuration-cache=true

# Give Gradle 4 GB of heap (Android builds are memory-hungry)
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# AndroidX support
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Suppress known non-transitive R class warning
android.nonTransitiveRClass=true
